# Publishes homgarapi-rathga to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API token / secret required.
# The package version comes from the release tag via GITHUB_REF_NAME
# (see setup.py), so tag releases as bare PEP 440 versions, e.g. `0.1.0`.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
